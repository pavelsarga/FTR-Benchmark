# CREPSModule-specific parameters (Pecka et al. 2016, Constrained REPS) that don't
# belong in the standard training config (configs/).

# Row index into env.current_frame_height_maps (shape (N, 45, 21), cell_size=0.05m) used
# as "terrain height ahead of the robot". Center row is height_map_size[0]//2 = 22;
# height_ahead_row=18 is 4 rows forward of center (4*0.05m = 0.20m), matching the paper's
# "height of the terrain approximately 20cm in front of the robot body".
height_ahead_row: 18
