
prim_config:
  set_attrs:
    - prim_path: terrain
      attr_name: "xformOp:translate"
      value: [0, 0, 0.35]
    - prim_path: terrain
      attr_name: "xformOp:orient"
      value: [ 1.0, 0, 0, 0.0 ]
    - prim_path: terrain
      attr_name: "xformOp:scale"
      value: [ 2, 2, 1 ]
map:                                                                                        
  lower: [-22, -22, -0.1]
  upper: [22, 22, 2]     
  cell_size: 0.05  

camera:
  position: [0, 40, 25]
  target: [0, 0, -5]

