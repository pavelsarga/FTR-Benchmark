# Worked example: a course of graded tiles, easiest (first repeat) ->
# hardest (last repeat). `repeats` is course-wide — every row gets the same
# number of tiles.
#
# Every obstacle's geometry constants (margins/widths/depths) have defaults
# baked into its own file, all overridable per-row via `extra:` — shown
# below for each of the six current types.
#
# Run:
#   python generate_terrain.py terrain_config_example.yaml \
#       --output-dir /path/to/src/FTR-Benchmark/ftr_envs/assets/terrain --overwrite
#
# (or --dry-run first, to sanity-check layout/heights without needing pxr/usd-core)

name: custom_mixed
seed: 42
cell_size: 0.05
repeats: 10

tile:
  width: 8.8            # travel/X direction
  depth: 3.333333333333  # lane/Y direction

border_width: 2.0
base_z: 0.5

camera:
  position: [-40, 40, 25]
  target: [0, 5, -5]

rows:
  # raised_platform defaults: 1.5m spawn + 2m platform + 1.5m goal.
  # Here widened to a 3m platform with tighter 1m margins on each side
  # (1 + 3 + 1 = the default 5m tile.width).
  - type: raised_platform
    min_height: 0.10
    max_height: 0.3
    extra: {platform_width: 3.0}

  # double_trench defaults: 1m spawn + 1m trench + 1m level ground + 1m
  # trench + 1m goal. Here narrowed to 0.5m-wide trenches with a wider 2m
  # level ground section between them (1 + 0.5 + 2 + 0.5 + 1 = 5m).
  - type: double_trench
    min_height: 0.15
    max_height: 0.3
    extra: {trench_width: 1.0, middle_width: 1.0}

  # widening_trench defaults: 1.5m spawn + trench (width graded 0.3m ->
  # 1.5m, depth fixed 0.3m) + goal. Here starting closer to the tile edge
  # and cut twice as deep.
  - type: widening_trench
    extra: {trench_depth: 0.25, min_width: 0.3, max_width: 1.5}

  # log_crossing defaults: 1.5m spawn + a 2m x 1m log (axis along the travel
  # direction — the robot rides along its top, not over it) + 1.5m goal.
  # Here a shorter, closer, narrower log.
  - type: log_crossing
    min_height: 0.20
    max_height: 0.30
    extra: {log_length: 1.5, log_width: 0.2}

  # twin_rails defaults: 1m spawn + 0.2m rail + 1m gap + 0.2m rail + goal,
  # enclosed on both sides by 0.1m guard walls 0.15m above the rails. Here
  # thicker rails with a wider gap and taller walls.
  - type: twin_rails
    min_height: 0.15
    max_height: 0.3
    extra: {rail_width: 0.3, gap_width: 1.5, wall_height: 0.25}

  # diagonal_trunk defaults: a raised block crossing the lane at a tilt
  # graded -45deg -> 45deg across repeats (never exactly 0 = perpendicular),
  # enclosed by 0.25m guard walls (fixed 3m length, regardless of angle)
  # 0.15m above the trunk. Here a smaller crossing (narrower trunk, tighter
  # angle range) with taller walls.
  - type: diagonal_trunk
    min_height: 0.15
    max_height: 0.3
    extra: {min_angle: -45, max_angle: 45, trunk_width: 0.35, wall_height: 0.2}

  # raised_stairs defaults: 0.5m spawn + 5 steps up (0.3m tread each) + 1m
  # platform + 5 steps down (mirrored) + 0.5m goal. Tread depth is FIXED —
  # only the rise per step (and platform height) grades with difficulty.
  # Here fewer, deeper treads.
  - type: raised_stairs
    min_height: 0.30
    max_height: 0.80
    extra: {n_steps: 4, step_length: 0.2, platform_length: 0.8}

  # lowered_stairs defaults: same layout as raised_stairs but recessed (down
  # into a pit instead of up onto a platform), enclosed by 0.1m side beams
  # on every recessed segment (see MIN_EDGE_MARGIN).
  - type: lowered_stairs
    min_height: 0.3
    max_height: 0.8
    extra: {n_steps: 4, step_length: 0.2, platform_length: 0.8}
  
  - type: raised_stairs
    min_height: 0.3
    max_height: 0.8
    extra: {n_steps: 3, step_length: 0.4, platform_length: 0.8}

  # cobblestones defaults: 1m spawn + a 3m x 3m field split into an 11x11
  # grid of raised blocks (each independently randomized between 0 and
  # diff.height) + 1m goal. Here a coarser 7x7 grid, taller field.
  - type: cobblestones
    min_height: 0.10
    max_height: 0.3
    extra: {grid_n: 11}

  - type: cobblestones
    min_height: 0.10
    max_height: 0.3
    extra: {grid_n: 5}

  # rock_formation defaults: like cobblestones, but spatially-correlated
  # noise quantized into 4 discrete height tiers (a cohesive stepped look,
  # not checkerboard static), with cells below the dropout threshold
  # omitted entirely for a ragged, irregular footprint. Here more, finer
  # tiers and a higher dropout for a more broken-up field.
  - type: rock_formation
    min_height: 0.3
    max_height: 0.4
    extra: {grid_n: 8, n_levels: 6, dropout: 0.35, coarse_n: 5}

  # diagonal_pyramid defaults: a 3m x 3m grid, ALWAYS fully populated (no
  # dropout, no missing cubes), banded diagonally into 7 rows that rise
  # from both edges to a single peak row through the center. Row count is
  # fixed; only the rise per row grades with difficulty. Here 13 rows with
  # the outermost 4 on each end hidden (height 0), giving a flat corner
  # before the visible steps begin.
  - type: diagonal_pyramid
    min_height: 0.20
    max_height: 0.60
    extra: {n_rows: 13, hidden_layers: 4}

  # half_platform defaults: 1m spawn + a 3m x 3m field with only its LEFT or
  # RIGHT half (split along the lane/Y axis) raised, alternating sides every
  # repeat (not random) so the robot's loaded track flips back and forth
  # along the row, for asymmetric-traversal training. diff.height grades the
  # raised half's height.
  - type: half_platform
    min_height: 0.10
    max_height: 0.35
    extra: {field_size: 3.0}

  # flat_patch: no obstacle, just the bare tile — a rest/baseline lane.
  - type: flat_patch

  # stump: a fixed-height smooth radial bump whose center slides from
  # slightly left of the lane's centerline (t=0) to slightly right (t=1).
  - type: stump

  # stairs_ascent_descent defaults: a one-way staircase spanning the full
  # tile, alternating ascending/descending by repeat — the platform's
  # height (diff.height) grades across repeats.
  - type: stairs_ascent_descent
    min_height: 0.3
    max_height: 0.8