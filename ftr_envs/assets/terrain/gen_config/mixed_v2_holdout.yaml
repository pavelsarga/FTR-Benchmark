# mixed_v2_holdout — generalization course. Built ONLY from the obstacle
# classes the policy trains on in mixed_v2_straight, each one varied:
# heights/angles that fall BETWEEN the training columns, different random
# seeds for the fields, different tread/post sizes, the opposite handedness
# order, and two new sequences of familiar parts. Nothing here is a class
# the policy has never seen — a drop on this course is a generalization
# gap, not a missing skill. Never train on it.
#
# On top of the parameter variations, every feature sits at a seeded random
# OFFSET inside its tile (`feature_offset`: up to 0.5 m along the path, 0.4 m
# across it) — the training courses always centre the obstacle, so "the
# obstacle is 3.4 m from the spawn point" is a learnable shortcut that this
# course takes away. One-way stairs, sequences and flat lanes are exempt.
#
#   bash scripts/eval_auto.sh <run_dir> --map mixed_v2_holdout --num_envs 256 --repeats 20 \
#       --output_dir logs/policy_eval --eval_id holdout_<policy> --headless

name: mixed_v2_holdout
seed: 31337
cell_size: 0.05
repeats: 10
bidirectional: true
spawn_lateral_jitter: 0.20
feature_offset: {x: 0.5, y: 0.4}

tile:
  width: 8.8
  depth: 3.333333333333

border_width: 2.0
arena_band: {wall_height: 1.0, wall_width: 0.2}   # flat 2 m ring + fence, so overshooting robots stay on ground
base_z: 0.5

camera:
  position: [-40, 40, 25]
  target: [0, 5, -5]

rows:
  - type: raised_platform
    min_height: 0.22
    max_height: 0.29
    extra: {platform_width: 1.4}

  - type: lowered_platform
    name: pit
    min_height: 0.20
    max_height: 0.28
    extra: {pit_width: 2.0}

  - type: double_trench
    min_height: 0.18
    max_height: 0.28
    extra: {trench_width: 0.8, middle_width: 1.4}

  - type: widening_trench
    name: drive_trench
    extra: {trench_depth: 0.22, min_width: 0.8, max_width: 1.3}

  - type: widening_trench
    name: deep_gap
    extra: {trench_depth: 0.5, min_width: 0.20, max_width: 0.40}

  - type: log_crossing
    min_height: 0.12
    max_height: 0.26
    extra: {log_length: 2.0, log_width: 0.30}

  - type: twin_rails
    min_height: 0.18
    max_height: 0.30
    extra: {rail_width: 0.3, gap_width: 1.2, wall_height: 0.25}

  - type: round_log
    min_height: 0.18
    max_height: 0.26
    extra: {min_yaw: 10, max_yaw: 30, mirror_alternate: true}

  - type: diagonal_trunk
    min_height: 0.22
    max_height: 0.28
    extra: {min_angle: -20, max_angle: -40, trunk_width: 0.4, wall_height: 0.2, mirror_alternate: true}

  - type: raised_stairs
    min_height: 0.50          # 5 x 0.10
    max_height: 0.80          # 5 x 0.16
    extra: {n_steps: 5, step_length: 0.27, platform_length: 0.5}

  - type: lowered_stairs
    min_height: 0.30
    max_height: 0.48
    extra: {n_steps: 3, step_length: 0.32, platform_length: 0.8}

  - type: stairs_ascent_descent
    min_height: 0.33
    max_height: 0.51
    extra: {n_steps: 3, step_length: 0.32}

  - type: diagonal_stairs
    min_height: 0.40          # 4 x 0.10
    max_height: 0.56          # 4 x 0.14
    extra: {n_steps: 4, step_length: 0.27, platform_length: 0.5, min_yaw: 20, max_yaw: 30, mirror_alternate: true}

  - type: cobblestones
    min_height: 0.18
    max_height: 0.28
    extra: {grid_n: 8, max_step: 0.12}

  - type: stepfield
    min_height: 0.18
    max_height: 0.28
    extra: {post_size: 0.20, n_posts: 12}

  - type: rock_formation
    min_height: 0.28
    max_height: 0.36
    extra: {grid_n: 6, n_levels: 5, dropout: 0.3, coarse_n: 4}

  - type: diagonal_pyramid
    min_height: 0.25
    max_height: 0.40
    extra: {n_rows: 11, hidden_layers: 3}

  - type: half_platform
    min_height: 0.18
    max_height: 0.28
    extra: {field_size: 2.4}

  - type: stump
    min_height: 0.22
    max_height: 0.32
    extra: {scale: 0.6}

  - type: stump_field
    min_height: 0.22
    max_height: 0.32
    extra: {n_stumps: 3, spacing: 1.1, scale: 0.75, offset: 0.35, mirror_alternate: true, mesh_stride: 2}

  - type: pitch_ramp
    name: ridge_ramp
    extra: {shape: A, min_angle: 12, max_angle: 26, ramp_length: 1.0, plateau_length: 0.6, mesh_stride: 2}

  - type: pitch_ramp
    name: valley_ramp
    extra: {shape: V, min_angle: 12, max_angle: 26, ramp_length: 1.2, plateau_length: 1.4, mesh_stride: 2}

  - type: diagonal_ramp
    extra: {min_angle: 12, max_angle: 20, min_yaw: 20, max_yaw: 30, ramp_length: 1.1, mirror_alternate: true, mesh_stride: 2}

  - type: cross_slope
    extra: {min_roll: 10, max_roll: 22, hold_length: 2.6, twist_length: 0.8, mirror_alternate: true, mesh_stride: 2}

  - type: crossing_ramps
    extra: {min_angle: 5, max_angle: 9, wedge_length: 0.5, n_wedges: 8, mirror_alternate: true}

  - type: wave
    min_height: 0.08
    max_height: 0.18
    extra: {wavelength: 1.0, n_periods: 4, min_yaw: 10, max_yaw: 20, mirror_alternate: true, mesh_stride: 2}

  - type: tilted_pallet
    extra: {min_pitch: 10, max_pitch: 16, min_yaw: 15, max_yaw: 25, pallet_length: 1.0, mirror_alternate: true}

  # familiar parts, new order / new pairing
  - type: sequence
    name: step_then_log
    extra:
      parts:
        - {type: flat_patch, width: 1.2}
        - {type: raised_platform, min_height: 0.20, max_height: 0.30, width: 2.4, extra: {platform_width: 1.0}}
        - {type: round_log, min_height: 0.15, max_height: 0.22, width: 2.6}
        - {type: flat_patch, width: 2.6}

  - type: sequence
    name: pit_then_step
    extra:
      parts:
        - {type: flat_patch, width: 1.0}
        - {type: lowered_platform, min_height: 0.18, max_height: 0.26, width: 2.8, extra: {pit_width: 1.2}}
        - {type: raised_platform, min_height: 0.18, max_height: 0.28, width: 2.4, extra: {platform_width: 1.0}}
        - {type: flat_patch, width: 2.6}

  - type: flat_patch
