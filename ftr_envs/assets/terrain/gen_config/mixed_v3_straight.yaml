# mixed_v3_straight — mixed_v2_straight rebalanced for descents (misc/metric_research README §5e).
# v2's census: the first sharp edge met goes up on 73 % of drives, every drop follows a climb of the
# same height at a fixed distance, and the obstacle sits at a near-fixed distance from spawn (sd
# 0.02 m on most rows). v3 changes, nothing else:
#   * ten LOWERED rows (extra.lowered: the obstacle mirrored about the ground, ftr_terrain_gen/
#     variants.py): cobblestones, coarse_cobbles, stepfield, half_platform, stump_field, wave,
#     round_log, diagonal_log (gutters), rock_formation, diagonal_pyramid (inverted)
#   * feature_offset x 0.5: each obstacle shifted up to +-0.5 m along the path per tile
#   * extra.sample: platform / pit / stair-platform / trench / field lengths drawn per tile, and
#     raised_platform.exit_height_ratio in [0.5, 1.15] (two-tier platform: drop != rise; the
#     upper bound keeps the climb <= 0.30 m, MARV's step-up limit, in both directions)
# Generated from this file with a script; edit here, not in the generated gen_config copy.
name: mixed_v3_straight
